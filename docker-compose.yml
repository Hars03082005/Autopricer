version: '3.8'

services:
  backend:
    container_name: price-prediction-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app/backend
      - ./model_artifacts:/app/model_artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - price-prediction-network

  frontend:
    container_name: price-prediction-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        VITE_API_URL: http://localhost:9000
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:9000
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - price-prediction-network

networks:
  price-prediction-network:
    driver: bridge
