<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-Powered Vehicle Valuation and Pricing Intelligence Platform — instant, data-driven car valuations with explainable AI." />
    <meta name="theme-color" content="#0f0f1a" />
    <title>PriceRef — Intelligent Vehicle Pricing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime configuration, written by the container entrypoint on boot.
         Loaded before the bundle (and non-module, so it is not deferred) so
         that window.__PRICEREF_CONFIG__ exists by the time app code runs.
         This is what lets one built image be promoted staging -> production:
         Vite inlines import.meta.env.VITE_* at build time, so without it the
         API and Supabase URLs would be frozen into the artifact. In `npm run
         dev` this serves public/config.js, which intentionally sets nothing
         and leaves the .env values in charge. -->
    <script src="./config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
